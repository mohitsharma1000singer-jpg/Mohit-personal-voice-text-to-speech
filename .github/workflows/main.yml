                  "भारत की राजधानी नई दिल्ली है।",
                  "हम सब मिलकर यह काम जल्दी पूरा करेंगे।",
                  "कल शाम को मेरे दोस्त के घर दावत है।",
                  "पढ़ाई में मेहनत करने वाले विद्यार्थी हमेशा सफल होते हैं।",
