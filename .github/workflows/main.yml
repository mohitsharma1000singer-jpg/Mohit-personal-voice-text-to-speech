          package com.mohit.ttsdata

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ContentValues
          import android.content.pm.PackageManager
          import android.media.*
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.view.View
          import android.widget.*
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.OutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.util.Locale
          import java.util.zip.ZipEntry
          import java.util.zip.ZipOutputStream

          class MainActivity : Activity() {
              private val RATE = 22050
              private lateinit var base: File
              private var projDir: File? = null
              private var sentences: List<String> = emptyList()
              private var idx = 0
              @Volatile private var recFlag = false
              @Volatile private var discard = false
              @Volatile private var fetching = false
              private var recThread: Thread? = null
              private var player: MediaPlayer? = null
              private var tvStatus: TextView? = null
              private var tvSentence: TextView? = null
              private var btnRec: Button? = null

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  base = File(filesDir, "projects")
                  base.mkdirs()
                  showHome()
              }

              override fun onPause() {
                  super.onPause()
                  stopRecording(true)
                  releasePlayer()
              }

              override fun onBackPressed() {
                  if (projDir != null) showHome() else super.onBackPressed()
              }

              // ---------- UI helpers ----------
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun page(views: List<View>): ScrollView {
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(16), dp(16), dp(16), dp(16))
                  for (v in views) col.addView(v)
                  val sv = ScrollView(this)
                  sv.addView(col)
                  return sv
              }

              private fun tv(t: String, size: Float = 18f): TextView {
                  val x = TextView(this)
                  x.text = t
                  x.textSize = size
                  x.setPadding(0, dp(8), 0, dp(8))
                  return x
              }

              private fun btn(t: String, f: () -> Unit): Button {
                  val x = Button(this)
                  x.text = t
                  x.textSize = 18f
                  x.setOnClickListener { f() }
                  return x
              }

              private fun announce(m: String) {
                  window.decorView.announceForAccessibility(m)
              }

              // ---------- file helpers ----------
              private fun loadSentences(d: File): List<String> {
                  val f = File(d, "sentences.txt")
                  return if (f.exists()) f.readLines().filter { it.isNotBlank() } else emptyList()
              }

              private fun wav(d: File, i: Int): File =
                  File(File(d, "wavs"), String.format(Locale.US, "audio_%03d.wav", i + 1))

              private fun saveMeta(d: File) {
                  val sb = StringBuilder()
                  for (i in sentences.indices) {
                      if (wav(d, i).exists()) {
                          sb.append(String.format(Locale.US, "audio_%03d", i + 1))
                          sb.append('|').append(sentences[i]).append('\n')
                      }
                  }
                  File(d, "metadata.csv").writeText(sb.toString())
              }

              private fun writeWav(f: File, pcm: ByteArray) {
                  val h = ByteBuffer.allocate(44).order(ByteOrder.LITTLE_ENDIAN)
                  h.put("RIFF".toByteArray()); h.putInt(36 + pcm.size); h.put("WAVE".toByteArray())
                  h.put("fmt ".toByteArray()); h.putInt(16); h.putShort(1); h.putShort(1)
                  h.putInt(RATE); h.putInt(RATE * 2); h.putShort(2); h.putShort(16)
                  h.put("data".toByteArray()); h.putInt(pcm.size)
                  f.outputStream().use { it.write(h.array()); it.write(pcm) }
              }

              // ---------- screens ----------
              private fun showHome() {
                  stopRecording(true)
                  releasePlayer()
                  projDir = null; tvStatus = null; tvSentence = null; btnRec = null
                  val v = ArrayList<View>()
                  v.add(tv("TTS डेटासेट रिकॉर्डर", 24f))
                  v.add(btn("नया प्रोजेक्ट बनाएँ") { newProject() })
                  val dirs = base.listFiles()?.filter { it.isDirectory }?.sortedBy { it.name } ?: emptyList()
                  if (dirs.isEmpty()) v.add(tv("अभी कोई प्रोजेक्ट नहीं है। ऊपर के बटन से नया बनाएँ।"))
                  for (d in dirs) {
                      val s = loadSentences(d)
                      val done = s.indices.count { wav(d, it).exists() }
                      v.add(btn("${d.name} — ${s.size} में से $done रिकॉर्ड हुए") { openProject(d) })
                  }
                  setContentView(page(v))
              }

              private fun newProject() {
                  val et = EditText(this)
                  et.hint = "प्रोजेक्ट का नाम, जैसे Mohit_Hindi_Voice_1"
                  AlertDialog.Builder(this)
                      .setTitle("नया प्रोजेक्ट")
                      .setView(et)
                      .setPositiveButton("हिंदी") { _, _ -> createProject(et.text.toString(), "hi") }
                      .setNegativeButton("English") { _, _ -> createProject(et.text.toString(), "en") }
                      .setNeutralButton("रद्द करें", null)
                      .show()
              }

              private fun createProject(raw: String, lang: String) {
                  val name = raw.trim().replace(Regex("[^\\p{L}\\p{N}_-]"), "_")
                  if (name.isEmpty()) {
                      Toast.makeText(this, "नाम खाली है", Toast.LENGTH_LONG).show()
                      return
                  }
                  val d = File(base, name)
                  if (d.exists()) {
                      Toast.makeText(this, "इस नाम का प्रोजेक्ट पहले से है", Toast.LENGTH_LONG).show()
                      return
                  }
                  File(d, "wavs").mkdirs()
                  val list = if (lang == "hi") Sentences.HI else Sentences.EN
                  File(d, "sentences.txt").writeText(list.joinToString("\n"))
                  File(d, "lang.txt").writeText(lang)
                  openProject(d)
              }

              private fun openProject(d: File) {
                  projDir = d
                  sentences = loadSentences(d)
                  idx = sentences.indices.firstOrNull { !wav(d, it).exists() } ?: maxOf(0, sentences.size - 1)
                  val st = tv("", 16f)
                  val se = tv("", 28f)
                  val rec = btn("रिकॉर्ड करें") { toggleRecord() }
                  tvStatus = st; tvSentence = se; btnRec = rec
                  val v = ArrayList<View>()
                  v.add(tv(d.name, 22f))
                  v.add(st)
                  v.add(se)
                  v.add(rec)
                  v.add(btn("अपनी रिकॉर्डिंग सुनें") { playCurrent() })
                  v.add(btn("पिछला वाक्य") { go(-1) })
                  v.add(btn("अगला वाक्य") { go(1) })
                  v.add(btn("अगला बिना रिकॉर्ड वाला वाक्य") { goNextEmpty() })
                  v.add(btn("इंटरनेट से और वाक्य जोड़ें") { fetchMore() })
                  v.add(btn("प्रोजेक्ट की ज़िप बनाएँ") { exportZip() })
                  v.add(btn("यह प्रोजेक्ट मिटाएँ") { confirmDelete() })
                  v.add(btn("होम पर जाएँ") { showHome() })
                  setContentView(page(v))
                  refresh()
                  if (sentences.isNotEmpty()) announce("वाक्य ${idx + 1}। ${sentences[idx]}")
              }

              private fun refresh() {
                  val d = projDir ?: return
                  if (sentences.isEmpty()) {
                      tvSentence?.text = "इस प्रोजेक्ट में कोई वाक्य नहीं है"
                      return
                  }
                  val done = sentences.indices.count { wav(d, it).exists() }
                  val has = wav(d, idx).exists()
                  tvStatus?.text = "वाक्य ${idx + 1} / ${sentences.size} — " +
                      (if (has) "रिकॉर्ड हो चुका है" else "अभी रिकॉर्ड नहीं हुआ") + " — कुल $done रिकॉर्ड"
                  tvSentence?.text = sentences[idx]
                  btnRec?.text = if (recFlag) "रुकें और सेव करें" else if (has) "फिर से रिकॉर्ड करें" else "रिकॉर्ड करें"
              }

              private fun busy(): Boolean = recFlag || recThread?.isAlive == true

              private fun go(delta: Int) {
                  if (busy() || sentences.isEmpty()) return
                  idx = (idx + delta).coerceIn(0, sentences.size - 1)
                  refresh()
                  announce("वाक्य ${idx + 1}। ${sentences[idx]}")
              }

              private fun goNextEmpty() {
                  val d = projDir ?: return
                  if (busy() || sentences.isEmpty()) return
                  var target = -1
                  for (i in idx + 1 until sentences.size) if (!wav(d, i).exists()) { target = i; break }
                  if (target < 0) for (i in 0 until sentences.size) if (!wav(d, i).exists()) { target = i; break }
                  if (target < 0) {
                      announce("सभी वाक्य रिकॉर्ड हो चुके हैं। चाहें तो इंटरनेट से और वाक्य जोड़ें।")
                      return
                  }
                  idx = target
                  refresh()
                  announce("वाक्य ${idx + 1}। ${sentences[idx]}")
              }

              private fun confirmDelete() {
                  val d = projDir ?: return
                  if (busy()) return
                  AlertDialog.Builder(this)
                      .setTitle("प्रोजेक्ट मिटाएँ?")
                      .setMessage("${d.name} और उसकी सारी रिकॉर्डिंग हमेशा के लिए मिट जाएँगी।")
                      .setPositiveButton("हाँ, मिटाएँ") { _, _ -> d.deleteRecursively(); showHome() }
                      .setNegativeButton("रद्द करें", null)
                      .show()
              }

              // ---------- more sentences from internet ----------
              private fun splitSentences(raw: String, lang: String): List<String> {
                  val t = raw.replace('\n', ' ')
                  val parts = if (lang == "hi") t.split("।") else t.split(Regex("(?<=[.!?])\\s+"))
                  val out = ArrayList<String>()
                  for (p in parts) {
                      var s = p.trim()
                      if (s.isEmpty()) continue
                      if (lang == "hi") s += "।"
                      if (s.length < 30 || s.length > 120) continue
                      if (s.any { it.isDigit() }) continue
                      if (s.any { it == '|' || it == '(' || it == ')' || it == '[' || it == ']' || it == '"' || it == ';' || it == ':' }) continue
                      if (lang == "hi") {
                          if (s.any { it in 'A'..'Z' || it in 'a'..'z' }) continue
                          val letters = s.filter { it.isLetter() }
                          if (letters.isEmpty()) continue
                          val dev = letters.count { it.code in 0x0900..0x097F }
                          if (dev * 100 / letters.length < 95) continue
                      } else {
                          if (!s.all { it.code < 128 }) continue
                          if (!s[0].isUpperCase()) continue
                          if (!(s.endsWith(".") || s.endsWith("?") || s.endsWith("!"))) continue
                      }
                      out.add(s)
                  }
                  return out
              }

              private fun fetchMore() {
                  val d = projDir ?: return
                  if (busy() || fetching) return
                  fetching = true
                  announce("इंटरनेट से नए वाक्य लाए जा रहे हैं, कृपया एक मिनट प्रतीक्षा करें")
                  val lf = File(d, "lang.txt")
                  val lang = if (lf.exists()) lf.readText().trim() else "hi"
                  val known = HashSet<String>(sentences)
                  Thread {
                      val found = ArrayList<String>()
                      var tries = 0
                      var fails = 0
                      while (found.size < 40 && tries < 60 && fails < 3) {
                          tries++
                          try {
                              val c = URL("https://$lang.wikipedia.org/api/rest_v1/page/random/summary").openConnection() as HttpURLConnection
                              c.connectTimeout = 8000
                              c.readTimeout = 8000
                              c.setRequestProperty("User-Agent", "TTSDatasetRecorder/1.0 (personal voice dataset)")
                              val body = c.inputStream.bufferedReader().use { it.readText() }
                              val extract = JSONObject(body).optString("extract", "")
                              for (s in splitSentences(extract, lang)) {
                                  if (!known.contains(s)) { known.add(s); found.add(s) }
                              }
                              fails = 0
                          } catch (e: Exception) {
                              fails++
                          }
                      }
                      if (found.isNotEmpty()) {
                          try {
                              File(d, "sentences.txt").appendText("\n" + found.joinToString("\n"))
                          } catch (e: Exception) { }
                      }
                      runOnUiThread {
                          fetching = false
                          if (projDir == d) {
                              sentences = loadSentences(d)
                              refresh()
                              if (found.isEmpty()) announce("कोई नया वाक्य नहीं मिला। इंटरनेट चालू है या नहीं जाँचें, या दोबारा कोशिश करें।")
                              else announce("${found.size} नए वाक्य जुड़ गए। अब कुल ${sentences.size} वाक्य हैं।")
                          }
                      }
                  }.start()
              }

              // ---------- zip export ----------
              private fun exportZip() {
                  val d = projDir ?: return
                  if (busy()) return
                  val n = sentences.indices.count { wav(d, it).exists() }
                  if (n == 0) {
                      announce("अभी कोई रिकॉर्डिंग नहीं है")
                      return
                  }
                  announce("ज़िप बन रही है, कृपया प्रतीक्षा करें")
                  val list = sentences
                  Thread {
                      var msg: String
                      try {
                          saveMeta(d)
                          val name = d.name + ".zip"
                          val out: OutputStream
                          val where: String
                          if (Build.VERSION.SDK_INT >= 29) {
                              val cv = ContentValues()
                              cv.put(MediaStore.Downloads.DISPLAY_NAME, name)
                              cv.put(MediaStore.Downloads.MIME_TYPE, "application/zip")
                              cv.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                              val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv)!!
                              out = contentResolver.openOutputStream(uri)!!
                              where = "Downloads फोल्डर"
                          } else {
                              val dir = getExternalFilesDir(null)!!
                              out = File(dir, name).outputStream()
                              where = dir.absolutePath
                          }
                          ZipOutputStream(out.buffered()).use { z ->
                              z.putNextEntry(ZipEntry("metadata.csv"))
                              z.write(File(d, "metadata.csv").readBytes())
                              z.closeEntry()
                              for (i in list.indices) {
                                  val f = wav(d, i)
                                  if (f.exists()) {
                                      z.putNextEntry(ZipEntry("wavs/" + f.name))
                                      f.inputStream().use { it.copyTo(z) }
                                      z.closeEntry()
                                  }
                              }
                          }
                          msg = "ज़िप तैयार हो गई: $name, $where में, $n रिकॉर्डिंग"
                      } catch (e: Exception) {
                          msg = "ज़िप नहीं बन सकी"
                      }
                      val m = msg
                      runOnUiThread {
                          announce(m)
                          Toast.makeText(this, m, Toast.LENGTH_LONG).show()
                      }
                  }.start()
              }

              // ---------- recording ----------
              private fun toggleRecord() {
                  if (recFlag) {
                      stopRecording(false)
                      refresh()
                      return
                  }
                  if (recThread?.isAlive == true) return
                  startRecording()
              }

              private fun stopRecording(disc: Boolean) {
                  if (!recFlag) return
                  discard = disc
                  recFlag = false
              }

              private fun startRecording() {
                  val d = projDir ?: return
                  if (sentences.isEmpty()) return
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1)
                      return
                  }
                  releasePlayer()
                  recFlag = true
                  discard = false
                  refresh()
                  val myIdx = idx
                  val target = wav(d, myIdx)
                  val am = getSystemService(AUDIO_SERVICE) as AudioManager
                  val fr = AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_EXCLUSIVE)
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build()
                      )
                      .setOnAudioFocusChangeListener { }
                      .build()
                  am.requestAudioFocus(fr)
                  try {
                      ToneGenerator(AudioManager.STREAM_MUSIC, 100).startTone(ToneGenerator.TONE_PROP_BEEP, 200)
                  } catch (e: Exception) { }
                  recThread = Thread {
                      val pcm = ByteArrayOutputStream()
                      try {
                          Thread.sleep(500)
                          if (recFlag) {
                              val min = AudioRecord.getMinBufferSize(RATE, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                              val rec = AudioRecord(
                                  MediaRecorder.AudioSource.MIC, RATE,
                                  AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT,
                                  maxOf(min, RATE)
                              )
                              val buf = ByteArray(4096)
                              rec.startRecording()
                              while (recFlag) {
                                  val n = rec.read(buf, 0, buf.size)
                                  if (n > 0) pcm.write(buf, 0, n)
                              }
                              rec.stop()
                              rec.release()
                          }
                      } catch (e: Exception) { }
                      val data = pcm.toByteArray()
                      var saved = false
                      if (!discard && data.size > RATE / 2) {
                          try {
                              writeWav(target, data)
                              saveMeta(d)
                              saved = true
                          } catch (e: Exception) { }
                      }
                      am.abandonAudioFocusRequest(fr)
                      val ok = saved
                      runOnUiThread { onRecordDone(ok, myIdx) }
                  }
                  recThread?.start()
              }

              private fun onRecordDone(saved: Boolean, i: Int) {
                  if (projDir == null) return
                  if (saved) {
                      var advanced = false
                      if (idx == i && idx < sentences.size - 1) { idx++; advanced = true }
                      refresh()
                      if (advanced) announce("रिकॉर्डिंग सेव हो गई। अगला वाक्य: ${sentences[idx]}")
                      else announce("रिकॉर्डिंग सेव हो गई। यह आख़िरी वाक्य था।")
                  } else {
                      refresh()
                      if (!discard) announce("रिकॉर्डिंग बहुत छोटी थी या नहीं हो सकी। फिर से कोशिश करें।")
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED)
                      announce("माइक की अनुमति मिल गई। अब रिकॉर्ड बटन दबाएँ।")
                  else
                      announce("माइक की अनुमति के बिना रिकॉर्डिंग नहीं हो सकती।")
              }

              // ---------- playback ----------
              private fun playCurrent() {
                  val d = projDir ?: return
                  if (busy() || sentences.isEmpty()) return
                  val f = wav(d, idx)
                  if (!f.exists()) {
                      announce("इस वाक्य की रिकॉर्डिंग अभी नहीं है")
                      return
                  }
                  releasePlayer()
                  try {
                      val p = MediaPlayer()
                      p.setDataSource(f.absolutePath)
                      p.setOnCompletionListener { releasePlayer() }
                      p.prepare()
                      p.start()
                      player = p
                  } catch (e: Exception) {
                      announce("रिकॉर्डिंग चल नहीं सकी")
                  }
              }

              private fun releasePlayer() {
                  try { player?.release() } catch (e: Exception) { }
                  player = null
              }
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TTS-Dataset-APK
          path: app/build/outputs/apk/debug/app-debug.apk
