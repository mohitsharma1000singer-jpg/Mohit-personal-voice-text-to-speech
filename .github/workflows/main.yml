                  "धन्यवाद, आपकी मदद के लिए मैं आपका आभारी हूँ।",
                  "सूरज पूरब से निकलता है और पश्चिम में डूबता है।",
                  "आज की परीक्षा मेरी उम्मीद से ज़्यादा आसान थी।",
                  "जो लोग धैर्य रखते हैं, उन्हें अंत में सफलता ज़रूर मिलती है।"
              )
              val EN = listOf(
                  "Hello, the weather is really pleasant today.",
                  "I enjoy taking a walk in the fresh morning air.",
                  "Could you please tell me where the market is?",
                  "The capital of India is New Delhi.",
                  "Together we will finish this work quickly.",
                  "There is a dinner at my friend's house tomorrow evening.",
                  "Hard-working students are usually successful.",
                  "Please close the door, it is very noisy outside.",
                  "Hot, buttery flatbreads are being made in the kitchen today.",
                  "The first drops of rain make the soil smell wonderful.",
                  "My name is Mohit and I live in Rajasthan.",
                  "Waking up early and sleeping on time is the key to a healthy life.",
                  "Books are our best friends.",
                  "Did you hear the news today?",
                  "This road goes straight to the railway station.",
                  "The children are playing happily in the field.",
                  "We should always respect our elders.",
                  "Last night I had a very beautiful dream.",
                  "The teacher taught a new lesson in class today.",
                  "A little ginger makes tea taste better.",
                  "One, two, three, four, five, six, seven, eight, nine, ten.",
                  "On Sunday we will go out together with the family.",
                  "Honesty is the best policy.",
                  "White snow was shining on the mountain peaks.",
                  "Please put your mobile phone on silent.",
                  "I love listening to music and reading stories.",
                  "Thank you, I am grateful for your help.",
